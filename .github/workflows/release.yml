name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11.x. npm trusted publishing needs npm >= 11.5.1 and
      # Node >= 22.14.0; Node 22 still ships npm 10.9.x, which is too old.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      # Opens a "Version Packages" PR when changesets are pending; publishes to
      # npm once that PR is merged.
      #
      # No npm token: the package uses npm trusted publishing, so authentication
      # comes from the OIDC id-token granted above. `changeset publish` shells
      # out to `pnpm publish` (it picks the tool from the lockfile), and pnpm
      # only understands OIDC from v11 — hence the pnpm@11 pin in package.json.
      #
      # Must be v2, which reads @changesets/cli v3's "Created git tags:" output.
      # v1 parses the older "New tag: pkg@version" format, so against CLI v3 it
      # silently concludes nothing was published and skips both the tag push and
      # the GitHub release while still exiting 0.
      #
      # create-github-releases and push-git-tags both default to true, and
      # push-with-git-cli defaults to false — so tags go up through the GitHub
      # API rather than `git push`, which avoids the workflow-scope restriction.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

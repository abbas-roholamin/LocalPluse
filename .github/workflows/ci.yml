name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is set by the test toolchain, not by the package: jsdom 30
        # needs Node ^22.22.2 || ^24.15.0 || >=26, and its undici dependency
        # needs >=22.19.0. The published package is browser-only and has no
        # runtime Node requirement at all.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build
